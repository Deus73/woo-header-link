name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Bouw en publiceer plugin-ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bouw installeerbare ZIP
        run: |
          git archive --format=zip --prefix=woo-header-link/ -o woo-header-link.zip HEAD
          ls -lh woo-header-link.zip
          unzip -l woo-header-link.zip

      - name: Upload als artifact
        uses: actions/upload-artifact@v4
        with:
          name: woo-header-link
          path: woo-header-link.zip

      - name: Publiceer als GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: woo-header-link.zip
          generate_release_notes: true
